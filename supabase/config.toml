# PBS Attend — LOCAL Supabase configuration (Supabase CLI + Docker).
#
# This file configures ONLY the local development stack started with `supabase start`.
# It is not linked to any remote Supabase project. Do NOT run `supabase link`,
# `supabase db push` or any command that targets a remote project from this repo
# without explicit approval.

# Local identifier for Docker containers. This is NOT a remote project reference.
project_id = "pbs-attend-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
# Access tokens expire after 1 hour; the server refreshes them with rotating refresh tokens.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Accounts are created by administrators only; no public sign-up.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "letters_digits"

[auth.email]
enabled = false
enable_confirmations = false

[auth.rate_limit]
# Supabase-side limit in addition to PBS Attend's own per-ID / per-IP throttling.
sign_in_sign_ups = 30
token_refresh = 150
